name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  # 1) Avval smoke-test: UZ/RU sahifalar, savat, test, "Bilim marafoni" oqimi.
  #    Test yiqilsa — deploy qilinmaydi (buzilgan kod saytga chiqmaydi).
  test:
    uses: ./.github/workflows/smoke-test.yml
  # 2) Faqat Hosting deploy qilinadi. firestore.rules bu yerda deploy QILINMAYDI —
  #    uni qo'lda: firebase deploy --only firestore:rules
  build_and_deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIDS09_84499 }}'
          channelId: live
          projectId: kids09-84499
