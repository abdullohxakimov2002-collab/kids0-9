<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids 0-9 bilim marafoni</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Kids 0-9 qadoqlash ranglari */
  --blue:#0B62BE;
  --blue-d:#084E9B;
  --blue-soft:#E7F0FB;
  --red:#E0342A;
  --green:#7AC143;
  --pink:#E5187E;
  --yellow:#F5C51F;
  --teal:#25B392;
  --purple:#9B4EA0;
  --orange:#F58220;
  --lilac:#B9A6D6;

  --ink:#32323C;
  --muted:#7C7C89;
  --line:#E3E8F0;
  --paper:#EFF3F8;
  --track:#EDF1F6;

  --accent:var(--blue);
  --display:'Fredoka', 'Nunito Sans', system-ui, sans-serif;
  --body:'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono:'Nunito Sans', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app{max-width:1180px;margin:0 auto;padding:0 16px 80px}

h1,h2,h3{margin:0;font-family:var(--display);font-weight:600}
.eyebrow{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{background:#fff;margin:0 -16px 24px;padding:14px 16px 0;box-shadow:0 2px 12px rgba(16,44,84,.06)}
.top-in{max-width:1148px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:13px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-txt b{display:block;font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink);line-height:1.2}
.brand-txt span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.logo{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:5px 9px 4px;line-height:1;flex:0 0 auto;box-shadow:0 3px 10px rgba(11,98,190,.13)}
.logo-kids{display:flex;align-items:center;gap:2.5px;font-family:var(--display);font-weight:600;font-size:14px;line-height:1}
.logo-kids i{width:3.5px;height:3.5px;border-radius:50%;background:var(--lilac)}
.logo-09{font-family:var(--display);font-weight:600;font-size:27px;color:var(--blue);letter-spacing:-.03em;margin-top:1px}
.logo-img{height:52px;width:auto;border-radius:10px}
.rainbow{height:6px;margin:0 -16px;background:linear-gradient(90deg,
  var(--blue) 0 14.28%, var(--green) 14.28% 28.56%, var(--yellow) 28.56% 42.84%,
  var(--orange) 42.84% 57.12%, var(--red) 57.12% 71.4%, var(--pink) 71.4% 85.68%, var(--purple) 85.68% 100%)}

/* ---------- buttons ---------- */
button{font-family:var(--body);font-size:14.5px;font-weight:700;cursor:pointer;border-radius:999px;transition:.15s ease}
.btn{background:var(--blue);color:#fff;border:2px solid var(--blue);padding:10px 22px}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-ghost{background:#fff;color:var(--blue);border:2px solid var(--line);padding:9px 18px}
.btn-ghost:hover{border-color:var(--blue);background:var(--blue-soft)}
.btn-amber{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-amber:hover{background:#DB6F12;border-color:#DB6F12}
.btn-danger{background:#fff;color:var(--red);border:2px solid #F3D3D1;padding:9px 18px}
.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:6px 14px;font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- forms ---------- */
label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;font-family:var(--body);font-size:15px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 14px}
textarea{border-radius:14px;line-height:1.6;resize:vertical;font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
.field{margin-bottom:15px}
.row{display:grid;gap:15px}
@media(min-width:620px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}}
.check{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.check input{width:auto;margin-top:3px;accent-color:var(--blue)}
.check span{font-size:14.5px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- cards: Kids 0-9 quti uslubi ---------- */
.card{position:relative;background:#fff;border:1px solid var(--line);border-top:9px solid var(--accent);border-radius:20px;padding:22px;box-shadow:0 4px 18px rgba(16,44,84,.05);overflow:hidden}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{background:var(--accent);color:#fff;border-radius:999px;padding:7px 20px;font-size:18px;font-weight:600}
.card:nth-of-type(2){--accent:var(--teal)}
.card:nth-of-type(3){--accent:var(--pink)}
.card:nth-of-type(4){--accent:var(--purple)}
.card:nth-of-type(5){--accent:var(--orange)}
.stack{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- ayiqcha ---------- */
.empty::after{content:'';display:block;width:112px;height:84px;margin:16px auto 0;opacity:.45;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 92'><g fill='%230B62BE'><circle cx='30' cy='22' r='15'/><circle cx='90' cy='22' r='15'/><path d='M10 92C10 48 32 24 60 24s50 24 50 68z'/></g><g fill='%23fff'><circle cx='44' cy='54' r='5.5'/><circle cx='76' cy='54' r='5.5'/><ellipse cx='60' cy='73' rx='9.5' ry='12'/></g></svg>") no-repeat center/contain}

/* ---------- ishtirokchi ---------- */
.enter{max-width:540px;margin:0 auto}
.enter-head{text-align:center;margin-bottom:20px}
.enter-head h1{font-size:clamp(28px,6.6vw,38px);line-height:1.15;margin:8px 0 8px;color:var(--blue)}
.enter-head p{color:var(--muted);margin:0;font-size:14.5px;font-weight:600}
.meta-strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}
.meta-strip span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.meta-strip b{color:var(--blue);font-weight:800}

/* progress: kapsula qatori */
.blister{display:flex;flex-wrap:wrap;gap:6px;padding:0;background:none;border:none}
.pill{width:26px;height:11px;border-radius:999px;background:#DDE4EE;border:none;transition:.2s}
.pill.done{background:var(--green)}
.pill.now{background:var(--orange);box-shadow:0 0 0 4px rgba(245,130,32,.2)}

.q-num{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.q-text{font-family:var(--display);font-size:clamp(20px,4.2vw,26px);font-weight:600;line-height:1.32;margin:9px 0 20px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:10px;font-size:15px;font-weight:600;line-height:1.45;color:var(--ink)}
.opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt .key{flex:0 0 auto;font-family:var(--display);font-size:14px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;background:var(--track);border-radius:50%;color:var(--muted)}
.opt.sel .key{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:#F1F9EA}
.opt.ok .key{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:#FDEDEC}
.opt.bad .key{background:var(--red);color:#fff}

.score-ring{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin:10px 0 18px}
.score-big{font-family:var(--display);font-weight:600;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:46px;line-height:1;color:#fff;background:var(--green);box-shadow:0 8px 22px rgba(122,193,67,.32)}
.score-big.fail{background:var(--red);box-shadow:0 8px 22px rgba(224,52,42,.28)}
.verdict{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
.v-pass{background:#EAF6DF;color:#4E8A22}
.v-fail{background:#FBE5E3;color:var(--red)}

/* ---------- admin ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);padding:9px 18px;color:var(--muted);font-size:13.5px;font-weight:700}
.tab:hover{color:var(--blue);border-color:var(--blue)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-top:8px solid var(--accent);border-radius:18px;padding:15px 16px;box-shadow:0 4px 14px rgba(16,44,84,.05)}
.kpis .kpi:nth-child(1){--accent:var(--blue)}
.kpis .kpi:nth-child(2){--accent:var(--green)}
.kpis .kpi:nth-child(3){--accent:var(--orange)}
.kpis .kpi:nth-child(4){--accent:var(--pink)}
.kpi .k{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.15;margin-top:4px;color:var(--accent)}
.kpi .s{font-size:12.5px;color:var(--muted);font-weight:600}

.gauge{position:relative;height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.gauge-fill{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:999px}
.gauge-fill.warn{background:var(--yellow)}
.gauge-fill.low{background:var(--red)}
.gauge-ticks{display:none}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:9px 10px;background:var(--blue-soft);white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px}
th:last-child{border-radius:0 10px 10px 0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-weight:600}
tr:last-child td{border-bottom:none}
.t-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rank{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);width:30px}
.rank.medal{color:#fff;background:var(--orange);border-radius:50%;width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px}
.right{text-align:right}
.nowrap{white-space:nowrap}

.qrow{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:14px 16px;margin-bottom:10px}
.qrow-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qrow-t{font-size:15px;font-weight:700;line-height:1.4}
.qrow ul{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:13.5px;font-weight:600}
.qrow li{margin-bottom:2px}
.qrow li.ok{color:#4E8A22;font-weight:800}
.qrow li::marker{color:var(--lilac)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue);padding:4px 10px;border-radius:999px}

.empty{text-align:center;padding:26px 18px 8px;color:var(--muted);font-weight:600}
.empty h3{font-family:var(--display);font-size:21px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0}

.note{background:#FFF8E6;border:1.5px solid #F2E0AE;border-radius:14px;padding:13px 15px;font-size:13.5px;font-weight:600;margin-bottom:15px}
.danger-zone{--accent:var(--red)}
.danger-zone .card-h h2{background:var(--red)}

.top-right{display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:700;z-index:99;box-shadow:0 8px 26px rgba(16,44,84,.3)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* --- bosqichlar --- */
.who{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-top:8px solid var(--blue);border-radius:18px;padding:14px 18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(16,44,84,.05);flex-wrap:wrap}
.who b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.who span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.who-score{text-align:right}
.who-score b{color:var(--blue);font-size:26px}
.stage-list{display:grid;gap:10px}
@media(min-width:720px){.stage-list{grid-template-columns:1fr 1fr}}
.stage{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;transition:.15s}
.stage-n{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:17px;background:var(--track);color:var(--muted)}
.stage-b{flex:1;min-width:0}
.stage-b b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.stage-s{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stage-r{font-family:var(--display);font-weight:600;font-size:20px}
.stage-r.ok{color:var(--green)}.stage-r.no{color:var(--red)}
.stage-go{font-size:13px;font-weight:800;color:var(--blue);white-space:nowrap}
.stage-lock{font-size:19px;color:#C6CEDA}
.stage.open{border-color:var(--blue);cursor:pointer;box-shadow:0 4px 14px rgba(11,98,190,.13)}
.stage.open:hover{background:var(--blue-soft);transform:translateY(-1px)}
.stage.open .stage-n{background:var(--blue);color:#fff}
.stage.done{border-color:#D6EBC4;background:#F7FCF3}
.stage.done .stage-n{background:var(--green);color:#fff}
.stage.locked,.stage.wait,.stage.noq{opacity:.62;background:#FAFBFD}
/* --- reyting --- */
.chainbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-top:7px solid var(--purple);border-radius:16px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.chainbar label{margin:0;white-space:nowrap}
.chainbar select{width:auto;min-width:210px;flex:1;padding:8px 12px}
.expl{background:#F7FBF3;border-left:4px solid var(--green);border-radius:10px;padding:11px 14px;margin-top:10px;font-size:13.5px;font-weight:600;color:#3F5F27;line-height:1.55}
.expl b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.formula{background:var(--blue-soft);border:1.5px solid #CBE0F7;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;color:var(--blue-d);margin-bottom:16px}
.formula span{display:block;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.5}
.podium{display:grid;gap:12px}
@media(min-width:640px){.podium{grid-template-columns:repeat(3,1fr)}}
.pod{border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center;background:#fff}
.pod-m{width:34px;height:34px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;background:var(--muted)}
.pod.p1{border-color:var(--yellow);background:#FFFBEC}.pod.p1 .pod-m{background:var(--yellow);color:#6A5300}
.pod.p2{border-color:#CFD8E3}.pod.p2 .pod-m{background:#9AA7B8}
.pod.p3{border-color:#E8CDB4}.pod.p3 .pod-m{background:var(--orange)}
.pod-n{font-weight:800;font-size:15px}
.pod-s{font-family:var(--display);font-weight:600;font-size:27px;color:var(--blue);line-height:1.2}
.pod-p{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:3px 13px;font-size:13px;font-weight:800;margin-top:5px}
.pod-d{font-size:12px;color:var(--muted);font-weight:600;margin-top:7px}
tr.dim{opacity:.55}
/* --- switch --- */
.sw{width:46px;height:26px;border-radius:999px;background:#D5DCE6;border:none;padding:3px;display:inline-flex;justify-content:flex-start;transition:.18s;cursor:pointer}
.sw span{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);display:block;transition:.18s}
.sw.on{background:var(--green);justify-content:flex-end}

</style>

<!-- Savollar banki. bank.js o'zgarsa ?v= ni oshiring. -->
<script src="/bilim-marafoni/bank.js?v=20260926"></script>

<script>
(function(){
'use strict';

var SETUP_KEY='setup';
function uid(){ return Math.random().toString(36).slice(2,9); }

// Savollar banki, bosqichlar, tarmoqlar va filiallar — bank.js faylida (window.BANK).
var BANK=window.BANK;
var BANK_VER=BANK.ver;

var DEFAULT_SETUP={
  ver:BANK_VER,
  config:{
    org:'Homeocan',
    testName:'Kids 0-9 bilim marafoni',
    logoUrl:'',
    passPercent:60,
    timeLimitMin:0,
    shuffle:true,
    shuffleOptions:false,
    showReview:false,
    kFactor:3,
    minCoverage:70,
    prizes:['300 $','200 $','100 $']
  },
  stages:BANK.stages,
  chains:BANK.chains,
  branches:BANK.branches,
  questions:BANK.questions
};

function sGet(k){
  return db.collection('meta').doc(k).get().then(function(doc){
    return doc.exists?doc.data().payload:null;
  }).catch(function(){ return null; });
}
function sSet(k,v){
  return db.collection('meta').doc(k).set({payload:v}).then(function(){return true;}).catch(function(){return false;});
}
function loadResults(){
  return db.collection('results').get().then(function(qs){
    var out=[]; qs.forEach(function(doc){ var d=doc.data(); d.id=doc.id; out.push(d); }); return out;
  }).catch(function(){ return []; });
}
function addResultDoc(r){
  var data={}; for(var k in r) if(k!=='id') data[k]=r[k];
  return db.collection('results').add(data).then(function(ref){ r.id=ref.id; return r; });
}
function deleteResultDoc(id){ return db.collection('results').doc(id).delete(); }
function clearAllResults(){
  return db.collection('results').get().then(function(qs){
    var batch=db.batch();
    qs.forEach(function(doc){ batch.delete(doc.ref); });
    return qs.empty?Promise.resolve():batch.commit();
  });
}
function chunk(arr,n){ var out=[]; for(var i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }
function bulkAddResults(list){
  return chunk(list,400).reduce(function(p,g){
    return p.then(function(){
      var batch=db.batch();
      g.forEach(function(r){
        var ref=db.collection('results').doc(), data={};
        for(var k in r) if(k!=='id') data[k]=r[k];
        batch.set(ref,data);
      });
      return batch.commit();
    });
  },Promise.resolve());
}
function batchUpdateResults(ids,patch){
  if(!ids.length) return Promise.resolve();
  return chunk(ids,400).reduce(function(p,g){
    return p.then(function(){
      var batch=db.batch();
      g.forEach(function(id){ batch.update(db.collection('results').doc(id),patch); });
      return batch.commit();
    });
  },Promise.resolve());
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pct(a,b){ return b>0?Math.round(a/b*100):0; }
function fmtDate(ts){ var d=new Date(ts); function p(n){return n<10?'0'+n:''+n;} return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtDur(s){ var m=Math.floor(s/60); return m+' daq '+(s%60<10?'0':'')+(s%60)+' s'; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode)t.parentNode.removeChild(t); },2600); }
function branchById(id){ var a=S.setup.branches,i; for(i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function chainById(id){ var a=S.setup.chains,i; for(i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function branchesOf(cid){
  return S.setup.branches.filter(function(b){ return b.chainId===cid; }).sort(function(a,b){
    var na=parseInt(a.name,10), nb=parseInt(b.name,10);
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
    return a.name.localeCompare(b.name,'uz');
  });
}
function findOrCreateBranch(cid,name){
  var nm=String(name).trim().replace(/\s+/g,' '), list=branchesOf(cid), i;
  for(i=0;i<list.length;i++) if(norm(list[i].name)===norm(nm)) return list[i];
  // Barqaror id: bir xil nom → bir xil id (reload va boshqa hamkasblar uchun ham).
  // Anonim ishtirokchi meta/setup'ga yoza olmaydi, shuning uchun filial faqat xotirada
  // qo'shiladi; admin kirganda syncSetupAsAdmin() uni natijalardan olib Firestore'ga yozadi.
  var b={id:manualBranchId(cid,nm),chainId:cid,name:nm,staff:0};
  S.setup.branches.push(b); if(S.authed) saveSetup(); return b;
}
function manualBranchId(cid,name){
  return 'm-'+cid+'-'+norm(name).replace(/[^0-9a-zЀ-ӿ]+/g,'-').replace(/^-+|-+$/g,'');
}
function activeChain(){
  if(S.chain && chainById(S.chain)) return S.chain;
  var used={}; S.results.forEach(function(r){ if(r.chainId) used[r.chainId]=(used[r.chainId]||0)+1; });
  var best=null,n=-1; Object.keys(used).forEach(function(k){ if(used[k]>n){n=used[k];best=k;} });
  return best || (S.setup.chains[0]&&S.setup.chains[0].id) || '';
}
function stageById(id){ var a=S.setup.stages,i; for(i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function stageQs(sid){ return S.setup.questions.filter(function(q){ return q.stage===sid; }); }
function openStages(){ return S.setup.stages.filter(function(s){ return s.open && stageQs(s.id).length; }); }
function gaugeClass(p){ return p>=70?'':(p>=50?'warn':'low'); }
function saveSetup(){ return sSet(SETUP_KEY,S.setup); }
function refreshBank(){
  var fresh=JSON.parse(JSON.stringify(DEFAULT_SETUP));
  var wasOpen={}; (S.setup.stages||[]).forEach(function(st){ wasOpen[st.id]=st.open; });
  fresh.stages.forEach(function(st){ if(wasOpen[st.id]!==undefined) st.open=wasOpen[st.id]; });
  S.setup.ver=fresh.ver;
  S.setup.stages=fresh.stages;
  S.setup.questions=fresh.questions;
  S.setup.chains=fresh.chains;
  var have={};
  (S.setup.branches||[]).forEach(function(b){ have[b.chainId+'|'+norm(b.name)]=1; });
  fresh.branches.forEach(function(b){ if(!have[b.chainId+'|'+norm(b.name)]) S.setup.branches.push(b); });
  if(S.authed) return saveSetup();
  S.setupDirty=true;                     // admin kirganda yoziladi (syncSetupAsAdmin)
  return Promise.resolve(false);
}

function download(name,text,mime){

function personKey(r){ return r.branchId+'|'+norm(r.first+' '+r.last); }

function bestByStage(list){
  var m={}; list.forEach(function(r){ if(!m[r.stageId]||r.percent>m[r.stageId].percent) m[r.stageId]=r; }); return m;
}
// Har bir qatnashuvchi: ochilgan bosqichlar bo'yicha o'rtacha (topshirmagan bosqich = 0)
function people(){
  var open=openStages(), map={};
  S.results.forEach(function(r){
    var k=personKey(r);
    if(!map[k]) map[k]={key:k,chainId:r.chainId,branchId:r.branchId,branchName:r.branchName,first:r.first,last:r.last,rs:[],time:0};
    map[k].rs.push(r);
  });
  return Object.keys(map).map(function(k){
    var p=map[k], best=bestByStage(p.rs), sum=0, done=0, time=0;
    open.forEach(function(st){ if(best[st.id]){ sum+=best[st.id].percent; done++; time+=best[st.id].durationSec; } });
    p.best=best; p.done=done; p.openCount=open.length;
    p.score=open.length?Math.round(sum/open.length):0;
    p.time=time;
    return p;
  });
}
function branchStats(cid){
  cid=cid||activeChain();
  var ppl=people().filter(function(p){ return p.chainId===cid; }), c=S.setup.config, K=c.kFactor||3;
  var global=ppl.length?ppl.reduce(function(a,p){return a+p.score;},0)/ppl.length:0;
  var map={};
  branchesOf(cid).forEach(function(b){ map[b.id]={id:b.id,name:b.name,staff:b.staff||0,list:[]}; });
  ppl.forEach(function(p){
    if(!map[p.branchId]) map[p.branchId]={id:p.branchId,name:p.branchName,staff:0,list:[]};
    map[p.branchId].list.push(p);
  });
  var out=Object.keys(map).map(function(k){
    var m=map[k], n=m.list.length;
    m.n=n;
    m.raw=n?Math.round(m.list.reduce(function(a,p){return a+p.score;},0)/n):0;
    m.adj=n?Math.round(((n*m.raw + K*global)/(n+K))*10)/10:0;
    m.coverage=m.staff?Math.min(100,Math.round(n/m.staff*100)):0;
    m.hasStaff=m.staff>0;
    m.qualified=m.hasStaff && m.coverage>=(c.minCoverage||0) && n>0;
    m.time=m.list.reduce(function(a,p){return a+p.time;},0);
    return m;
  });
  out.sort(function(a,b){
    if(a.qualified!==b.qualified) return a.qualified?-1:1;
    return b.adj-a.adj || b.coverage-a.coverage || a.time-b.time;
  });
  out.globalAvg=Math.round(global*10)/10;
  return out;
}

function myData(){
  // S.results — faqat admin uchun to'liq; ishtirokchida loadMine() (shu qurilmadagi o'z natijalari) asosiy manba.
  var mine=S.results.concat(loadMine()).filter(function(r){
    return r.branchId===S.me.branchId && norm(r.first)===norm(S.me.first) && norm(r.last)===norm(S.me.last);
  });
  return {best:bestByStage(mine),count:mine.length};
}
function stageState(st,idx,best){
  if(best[st.id]) return 'done';
  if(stageQs(st.id).length===0) return 'noq';   // 'empty' emas: .empty klassi "ayiqcha" rasmini chiqaradi
  if(!st.open) return 'locked';
  if(idx>0){
    var prev=S.setup.stages[idx-1];
    if(stageQs(prev.id).length && !best[prev.id]) return 'wait';
  }
  return 'open';
}

function viewStages(){
  var d=myData(), best=d.best, open=openStages();
  var sum=0,done=0;
  open.forEach(function(st){ if(best[st.id]){ sum+=best[st.id].percent; done++; } });
  var total=open.length?Math.round(sum/open.length):0;
  var html='<div class="who"><div><b>'+esc(S.me.first+' '+S.me.last)+'</b><span>'+esc(S.me.chainName+' \u00B7 '+S.me.branchName)+'</span></div>'+
    '<div class="who-score"><b>'+total+'%</b><span>'+done+' / '+open.length+' bosqich</span></div></div>';
  html+='<div class="stage-list">';
  S.setup.stages.forEach(function(st,i){
    var stt=stageState(st,i,best), qn=stageQs(st.id).length;
    var label={done:'Tugallandi',open:'Ochiq',locked:'Admin ruxsati kutilmoqda',wait:'Avval '+i+'-bosqichni tugating',noq:'Savollar kiritilmagan'}[stt];
    var res=best[st.id];
    html+='<div class="stage '+stt+'"'+(stt==='open'?' data-act="start-stage" data-id="'+st.id+'" role="button" tabindex="0"':'')+'>'+
      '<div class="stage-n">'+st.n+'</div>'+
      '<div class="stage-b"><b>'+esc(st.title)+'</b>'+
        '<span class="stage-s">'+(stt==='done'?'\u2713 ':stt==='locked'||stt==='wait'?'\u25CF ':'')+label+
        (qn?' \u00B7 '+qn+' savol':'')+'</span></div>'+
      (res?'<div class="stage-r '+(res.percent>=S.setup.config.passPercent?'ok':'no')+'">'+res.percent+'%</div>'
          :stt==='open'?'<div class="stage-go">Boshlash \u2192</div>':'<div class="stage-lock">\u26BF</div>')+
    '</div>';
  });
  return html+'</div>';
}

function viewRank(){

  var noStaff=brs.filter(function(b){return !b.staff;}).length;

        '<div class="pod-p">'+esc((c.prizes&&c.prizes[i])||'')+'</div>'+
        '<div class="pod-d">'+m.n+' farmatsevt \u00B7 qamrov '+m.coverage+'%</div></div>';
    });
    html+='</div></div>';

  html+='<div class="card"><div class="card-h"><h2>Filiallar reytingi</h2>'+
    '<button class="btn-ghost btn-sm" data-act="export-csv">CSV</button></div>'+
    '<div class="formula">Moslashtirilgan ball = (n \u00D7 filial o\u2018rtachasi + '+c.kFactor+' \u00D7 '+bs.globalAvg+') / (n + '+c.kFactor+')<br>'+
    '<span>n \u2014 filialda testni topshirgan farmatsevtlar soni. Kam odam topshirgan filial tarmoq o\u2018rtachasiga tortiladi, shuning uchun 2 kishilik filial 10 kishilik filialdan ustunlik ola olmaydi.</span></div>';

    html+='<div class="empty"><h3>Hali natija yo\u2018q</h3><p>Farmatsevtlar 1-bosqichni topshirgach reyting shakllanadi.</p></div></div>';

    bs.forEach(function(m,i){
      html+='<tr'+(m.qualified?'':' class="dim"')+'><td>'+(m.qualified?'<span class="rank'+(i<3?' medal':'')+'">'+(i+1)+'</span>':'<span class="rank">\u2014</span>')+'</td>'+
        '<td style="min-width:150px;font-weight:700">'+esc(m.name)+(m.qualified?'':' <span class="tag" style="background:#FBE5E3;color:var(--red)">qamrov past</span>')+'</td>'+
        '<td class="right num">'+(m.staff||'\u2014')+'</td>'+
        '<td class="right num">'+m.n+'</td>'+
        '<td class="right num">'+m.coverage+'%</td>'+
        '<td class="right num">'+m.raw+'%</td>'+
        '<td style="min-width:170px"><div style="display:flex;align-items:center;gap:10px">'+

    });
    html+='</tbody></table></div></div>';

  // top farmatsevtlar
  html+='<div class="card"><div class="card-h"><h2>Eng yaxshi farmatsevtlar</h2><span class="eyebrow">barcha bosqichlar yig\u2018indisi</span></div>';

  else{
    var top=ppl.slice().sort(function(a,b){ return b.score-a.score || b.done-a.done || a.time-b.time; }).slice(0,15);
    html+='<div class="t-wrap"><table><thead><tr><th></th><th>Farmatsevt</th><th>Filial</th><th class="right">Bosqich</th><th class="right">Umumiy ball</th></tr></thead><tbody>';
    top.forEach(function(p,i){
      html+='<tr><td><span class="rank'+(i<3?' medal':'')+'">'+(i+1)+'</span></td>'+
        '<td style="font-weight:700">'+esc(p.first+' '+p.last)+'</td>'+

        '<td class="right num">'+p.done+' / '+p.openCount+'</td>'+
        '<td class="right num" style="font-weight:800">'+p.score+'%</td></tr>';

function viewAdmin(){
  if(!S.authed) return viewLogin();
  var b=S.tab==='rank'?viewRank():S.tab==='stages'?viewStagesAdmin():S.tab==='results'?viewResults():
        S.tab==='questions'?viewQuestions():S.tab==='branches'?viewBranches():viewSettings();
  return tabs()+b;
}

/* ====== RENDER ====== */
function render(){
  if(!S.ready){ app.innerHTML='<div class="empty" style="padding-top:70px"><p>Yuklanmoqda\u2026</p></div>'; return; }
  var b=S.view==='admin'?viewAdmin():S.view==='test'?viewTest():S.view==='done'?viewDone():
        (S.me?viewStages():viewEnter());
  app.innerHTML=header()+b;
  if(S.view==='test'&&S.setup.config.timeLimitMin>0) tick();
}
function tick(){
  var el=document.getElementById('timer'); if(!el||!S.session) return;
  var left=Math.max(0,S.session.endAt-Date.now()), m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.style.color=left<60000?'var(--red)':'var(--muted)';
  if(left<=0) finish(true);
}

/* ====== AMALLAR ====== */
function startStage(sid){
  var st=stageById(sid), c=S.setup.config, qs=stageQs(sid);
  if(!qs.length){ toast('Bu bosqichda savol yo\u2018q'); return; }
  if(c.shuffle) qs=shuffle(qs);
  qs=qs.map(function(q){
    if(!c.shuffleOptions) return {id:q.id,text:q.text,expl:q.expl,options:q.options.slice(),correct:q.correct};
    var pr=shuffle(q.options.map(function(o,i){return {o:o,i:i};}));
    return {id:q.id,text:q.text,expl:q.expl,options:pr.map(function(p){return p.o;}),correct:pr.map(function(p){return p.i;}).indexOf(q.correct)};
  });
  S.session={stageId:sid,stageN:st.n,stageTitle:st.title,questions:qs,answers:new Array(qs.length).fill(null),
    idx:0,startedAt:Date.now(),endAt:Date.now()+(c.timeLimitMin>0?c.timeLimitMin*60000:0)};
  S.showErrors=false; saveLocal();
  S.view='test'; render(); window.scrollTo(0,0);
  if(c.timeLimitMin>0){ clearInterval(timerId); timerId=setInterval(tick,1000); }
}
function finish(auto){
  var s=S.session; if(!s) return;
  if(!auto){
    var un=s.answers.filter(function(a){return a==null;}).length;
    if(un>0&&!confirm(un+' ta savol javobsiz. Baribir yakunlaysizmi?')) return;
  }
  clearInterval(timerId); timerId=null;
  var score=0,detail=[];
  s.questions.forEach(function(q,i){
    if(s.answers[i]===q.correct) score++;
    detail.push({text:q.text,expl:q.expl,options:q.options,correct:q.correct,chosen:s.answers[i]});
  });
  var r={ts:Date.now(),stageId:s.stageId,stageN:s.stageN,
    chainId:S.me.chainId,chainName:S.me.chainName,branchId:S.me.branchId,branchName:S.me.branchName,first:S.me.first,last:S.me.last,
    score:score,total:s.questions.length,percent:pct(score,s.questions.length),
    durationSec:Math.round((Date.now()-s.startedAt)/1000),detail:detail};
  S.review=r; S.session=null; S.view='done'; S.showErrors=false; saveLocal();
  render(); window.scrollTo(0,0);
  addResultDoc(r).then(function(saved){ S.results.push(saved); addMine(saved); render(); }).catch(function(){ toast('Natija saqlanmadi — internetni tekshiring'); });
}
function csv(){
  var rows=[['Sana','Bosqich','Tarmoq','Filial','Ism','Familiya','Ball','Jami','Foiz','Vaqt (s)']];
  S.results.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(r){
    rows.push([fmtDate(r.ts),r.stageN,r.chainName||'',r.branchName,r.first,r.last,r.score,r.total,r.percent,r.durationSec]);
  });
  return rows.map(function(row){ return row.map(function(c){ c=String(c); return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';'); }).join('\n');
}
function syncQ(){
  if(!S.editQ) return;
  var t=document.getElementById('q-text'),c=document.getElementById('q-cat'),s=document.getElementById('q-stage');
  if(t) S.editQ.text=t.value; if(c) S.editQ.cat=c.value; if(s) S.editQ.stage=s.value;
  var ins=app.querySelectorAll('.q-opt'),i;
  for(i=0;i<ins.length;i++) S.editQ.options[parseInt(ins[i].getAttribute('data-i'),10)]=ins[i].value;
}

    cl.forEach(function(x,i){ if(x){ if(i===q.correct) nc=kept.length; kept.push(x); } });

app.addEventListener('keydown',function(e){
  var t=e.target;
  if((e.key==='Enter'||e.key===' ') && t.getAttribute && t.getAttribute('role')==='button' && t.hasAttribute('data-act')){ e.preventDefault(); t.click(); return; }
  if(e.key!=='Enter') return;
  if(!S.me&&S.view==='enter'&&e.target.id&&e.target.id.indexOf('f-')===0){ e.preventDefault(); app.querySelector('[data-act="login-me"]').click(); }
});

/* ====== ISHGA TUSHIRISH ======
   Anonim ishtirokchi faqat meta/setup'ni o'qiy oladi (firestore.rules). Natijalar
   (`results`) faqat admin login qilgandan keyin yuklanadi — loadAdminData(). */
sGet(SETUP_KEY).then(function(su){
  if(su&&su.config&&su.stages&&su.questions){
    S.setup=su;
    for(var k in DEFAULT_SETUP.config) if(S.setup.config[k]===undefined) S.setup.config[k]=DEFAULT_SETUP.config[k];
    if(!Array.isArray(S.setup.chains)||!S.setup.chains.length) S.setup.chains=DEFAULT_SETUP.chains.slice();
    if(!Array.isArray(S.setup.branches)) S.setup.branches=[];
    if(S.setup.ver!==BANK_VER) refreshBank();        // admin bo'lmasa — xotirada yangilanadi, admin kirganda yoziladi
  }else{
    S.setup=JSON.parse(JSON.stringify(DEFAULT_SETUP)); S.setupDirty=true;
  }
  restoreLocal();
  S.ready=true; render();
  if(S.view==='test'&&S.setup.config.timeLimitMin>0){ clearInterval(timerId); timerId=setInterval(tick,1000); }
  if(S.authed) loadAdminData();
}).catch(function(){ S.setup=JSON.parse(JSON.stringify(DEFAULT_SETUP)); S.results=[]; S.ready=true; render(); });

/* localStorage'dan login va tugallanmagan bosqichni tiklash */
function restoreLocal(){
  var loc=loadLocal();
  if(!loc) return;
  var me=loc.me, ok=loc.ver===BANK_VER && me && chainById(me.chainId);
  if(ok && !branchById(me.branchId)){
    // filial ro'yxatda yo'q: qo'lda yozilgan (m-...) bo'lsa xotiraga qaytaramiz, aks holda nomi bo'yicha qidiramiz
    var same=branchesOf(me.chainId).filter(function(b){ return norm(b.name)===norm(me.branchName); })[0];
    if(same){ me.branchId=same.id; me.branchName=same.name; }
    else if(/^m-/.test(me.branchId)) S.setup.branches.push({id:me.branchId,chainId:me.chainId,name:me.branchName,staff:0});
    else ok=false;                                     // admin filialni o'chirgan — qayta kirish kerak
  }
  if(!ok){ clearLocal(); return; }
  S.me=me;
  S.enterChain=me.chainId; S.enterBranch=me.branchName; S.enterBranchId=me.branchId;
  var ss=loc.session, rst=ss&&ss.stageId&&stageById(ss.stageId);
  if(rst&&rst.open&&Array.isArray(ss.questions)&&ss.questions.length&&Array.isArray(ss.answers)){
    S.session=ss; S.view='test';
  }
  saveLocal();
}

auth.onAuthStateChanged(function(u){
  S.authed=!!u;
  if(u){ if(S.ready) loadAdminData(); }
  else S.results=[];
  if(S.ready) render();
});

})();
</script>
