function render(){
  if(!S.ready){ app.innerHTML='<div class="empty" style="padding-top:70px"><p>Yuklanmoqda\u2026</p></div>'; return; }
  var b=S.view==='admin'?viewAdmin():S.view==='test'?viewTest():S.view==='done'?viewDone():
        (S.me?viewStages():viewEnter());
  app.innerHTML=header()+b;
  if(S.view==='test'&&S.setup.config.timeLimitMin>0) tick();
}
function tick(){
  var el=document.getElementById('timer'); if(!el||!S.session) return;
  var left=Math.max(0,S.session.endAt-Date.now()), m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.style.color=left<60000?'var(--red)':'var(--muted)';
  if(left<=0) finish(true);
}

/* ====== AMALLAR ====== */
function startStage(sid){
  var st=stageById(sid), c=S.setup.config, qs=stageQs(sid);
  if(!qs.length){ toast('Bu bosqichda savol yo\u2018q'); return; }
  if(c.shuffle) qs=shuffle(qs);
  qs=qs.map(function(q){
    if(!c.shuffleOptions) return {id:q.id,text:q.text,expl:q.expl,options:q.options.slice(),correct:q.correct};
    var pr=shuffle(q.options.map(function(o,i){return {o:o,i:i};}));
    return {id:q.id,text:q.text,expl:q.expl,options:pr.map(function(p){return p.o;}),correct:pr.map(function(p){return p.i;}).indexOf(q.correct)};
  });
  S.session={stageId:sid,stageN:st.n,stageTitle:st.title,questions:qs,answers:new Array(qs.length).fill(null),
    idx:0,startedAt:Date.now(),endAt:Date.now()+(c.timeLimitMin>0?c.timeLimitMin*60000:0)};
  S.view='test'; render(); window.scrollTo(0,0);
  if(c.timeLimitMin>0){ clearInterval(timerId); timerId=setInterval(tick,1000); }
}
function finish(auto){
  var s=S.session; if(!s) return;
  if(!auto){
    var un=s.answers.filter(function(a){return a==null;}).length;
    if(un>0&&!confirm(un+' ta savol javobsiz. Baribir yakunlaysizmi?')) return;
  }
  clearInterval(timerId); timerId=null;
  var score=0,detail=[];
  s.questions.forEach(function(q,i){
    if(s.answers[i]===q.correct) score++;
    detail.push({text:q.text,expl:q.expl,options:q.options,correct:q.correct,chosen:s.answers[i]});
  });
  var r={ts:Date.now(),stageId:s.stageId,stageN:s.stageN,
    chainId:S.me.chainId,chainName:S.me.chainName,branchId:S.me.branchId,branchName:S.me.branchName,first:S.me.first,last:S.me.last,
    score:score,total:s.questions.length,percent:pct(score,s.questions.length),
    durationSec:Math.round((Date.now()-s.startedAt)/1000),detail:detail};
  S.review=r; S.session=null; S.view='done';
  render(); window.scrollTo(0,0);
  addResultDoc(r).then(function(saved){ S.results.push(saved); }).catch(function(){ toast('Natija saqlanmadi — internetni tekshiring'); });
}
function csv(){
  var rows=[['Sana','Bosqich','Tarmoq','Filial','Ism','Familiya','Ball','Jami','Foiz','Vaqt (s)']];
  S.results.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(r){
    rows.push([fmtDate(r.ts),r.stageN,r.chainName||'',r.branchName,r.first,r.last,r.score,r.total,r.percent,r.durationSec]);
  });
  return rows.map(function(row){ return row.map(function(c){ c=String(c); return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';'); }).join('\n');
}

  var ins=app.querySelectorAll('.q-opt'),i;
  for(i=0;i<ins.length;i++) S.editQ.options[parseInt(ins[i].getAttribute('data-i'),10)]=ins[i].value;
}

  }
  if(el.id==='rank-chain'){ S.chain=el.value; render(); return; }
  if(el.id==='f-stage'){ S.stageFilter=el.value; render(); }
  if(el.id==='qf'){ S.qStage=el.value; render(); }
});

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');

  if(a==='go-admin'){ S.view='admin'; render(); window.scrollTo(0,0); return; }
  if(a==='exit-admin'){ S.view='enter'; S.editQ=S.editP=S.editS=null; S.bulk=false; render(); return; }
  if(a==='admin-logout'){ auth.signOut(); S.view='enter'; render(); return; }
  if(a==='logout'){ S.me=null; S.view='enter'; render(); return; }
  if(a==='use-list'){ e.preventDefault(); S.enterOther=false; render(); return; }
  if(a==='login'){
    var em=document.getElementById('ad-email').value.trim(), pw=document.getElementById('ad-pass').value;
    if(!em||!pw){ toast('Email va parolni kiriting'); return; }
    auth.signInWithEmailAndPassword(em,pw).catch(function(err){ toast('Kirish xato: '+err.message); });
    return;
  }
  if(a==='tab'){ S.tab=el.getAttribute('data-t'); S.editQ=S.editP=S.editS=null; S.bulk=false; render(); window.scrollTo(0,0); return; }

  if(a==='login-me'){
    var cid=document.getElementById('f-chain').value,
        sel=document.getElementById('f-branch-sel'),
        inp=document.getElementById('f-branch'),
        f=document.getElementById('f-first').value.trim(),
        l=document.getElementById('f-last').value.trim();
    if(!cid){ toast('Dorixona tarmog\u2018ini tanlang'); return; }
    var br=null;
    if(sel){
      if(!sel.value){ toast('Filialni tanlang'); return; }
      br=branchById(sel.value);
      if(!br){ toast('Filial topilmadi'); return; }
    }else{
      var bn=inp?inp.value.trim():'';
      if(!bn){ toast('Filial nomini yozing'); return; }
      br=findOrCreateBranch(cid,bn);
    }
    if(!f||!l){ toast('Ism va familiyani yozing'); return; }
    var ch=chainById(cid);
    S.me={chainId:cid,chainName:ch?ch.name:'',branchId:br.id,branchName:br.name,first:f,last:l};
    S.enterChain=cid; S.enterBranch=br.name; S.enterBranchId=br.id;
    render(); window.scrollTo(0,0); return;
  }
  if(a==='start-stage'){ startStage(id); return; }
  if(a==='pick'){ S.session.answers[S.session.idx]=parseInt(el.getAttribute('data-i'),10); render(); return; }
  if(a==='next'){ if(S.session.idx<S.session.questions.length-1){S.session.idx++;render();window.scrollTo(0,0);} return; }
  if(a==='prev'){ if(S.session.idx>0){S.session.idx--;render();window.scrollTo(0,0);} return; }
  if(a==='finish'){ finish(false); return; }
  if(a==='to-stages'){ S.review=null; S.view='enter'; render(); window.scrollTo(0,0); return; }

  if(a==='toggle-stage'){
    var st=stageById(id); st.open=!st.open; saveSetup(); render();
    toast(st.n+'-bosqich '+(st.open?'ochildi':'yopildi')); return;
  }
  if(a==='open-next'){
    var nx=null,i;
    for(i=0;i<S.setup.stages.length;i++) if(!S.setup.stages[i].open){ nx=S.setup.stages[i]; break; }
    if(!nx){ toast('Barcha bosqichlar ochiq'); return; }
    nx.open=true; saveSetup(); render(); toast(nx.n+'-bosqichga ruxsat berildi'); return;
  }
  if(a==='edit-stage'){ var s2=stageById(id); S.editS={id:s2.id,n:s2.n,title:s2.title}; render(); return; }
  if(a==='save-stage'){
    var t2=document.getElementById('st-title').value.trim();
    if(t2) stageById(S.editS.id).title=t2;
    S.editS=null; saveSetup(); render(); toast('Saqlandi'); return;
  }
  if(a==='cancel-stage'){ S.editS=null; render(); return; }

  if(a==='new-q'){ S.editQ={id:'',stage:(S.qStage!=='all'?S.qStage:'s1'),cat:'',text:'',options:['','','',''],correct:0}; render(); return; }
  if(a==='edit-q'){
    S.setup.questions.forEach(function(q){ if(q.id===id) S.editQ={id:q.id,stage:q.stage,cat:q.cat||'',text:q.text,options:q.options.slice(),correct:q.correct}; });
    render(); window.scrollTo(0,0); return;
  }
  if(a==='del-q'){
    if(!confirm('Savol o\u2018chirilsinmi?')) return;
    S.setup.questions=S.setup.questions.filter(function(q){return q.id!==id;});
    saveSetup(); render(); return;
  }
  if(a==='add-opt'){ syncQ(); S.editQ.options.push(''); render(); return; }
  if(a==='rm-opt'){
    syncQ(); var i2=parseInt(el.getAttribute('data-i'),10);
    S.editQ.options.splice(i2,1);
    if(S.editQ.correct>=S.editQ.options.length) S.editQ.correct=0; else if(S.editQ.correct>i2) S.editQ.correct--;
    render(); return;
  }
  if(a==='set-correct'){ S.editQ.correct=parseInt(el.getAttribute('data-i'),10); return; }
  if(a==='save-q'){
    syncQ(); var q=S.editQ, cl=q.options.map(function(x){return x.trim();});
    if(!q.text.trim()){ toast('Savol matnini yozing'); return; }
    if(cl.filter(Boolean).length<2){ toast('Kamida 2 ta javob kerak'); return; }
    if(!cl[q.correct]){ toast('To\u2018g\u2018ri javob bo\u2018sh'); return; }
    var kept=[],nc=0;
    cl.forEach(function(x,i){ if(x){ if(i===q.correct) nc=kept.length; kept.push(x); } });
    if(q.id) S.setup.questions.forEach(function(x){ if(x.id===q.id){x.text=q.text.trim();x.cat=q.cat.trim();x.stage=q.stage;x.options=kept;x.correct=nc;} });
    else S.setup.questions.push({id:uid(),stage:q.stage,cat:q.cat.trim(),text:q.text.trim(),options:kept,correct:nc});
    S.editQ=null; saveSetup(); render(); toast('Saqlandi'); return;
  }
  if(a==='cancel-q'){ S.editQ=null; render(); return; }
  if(a==='bulk'){ S.bulk=true; render(); return; }
  if(a==='cancel-bulk'){ S.bulk=false; render(); return; }
  if(a==='save-bulk'){
    var sid=document.getElementById('bulk-stage').value, n=0;
    document.getElementById('bulk-text').value.split(/\n\s*\n/).forEach(function(bk){
      var ls=bk.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(ls.length<3) return;
      var ops=[],cor=-1;
      ls.slice(1).forEach(function(x){ if(x.charAt(0)==='*'){cor=ops.length;ops.push(x.slice(1).trim());} else ops.push(x); });
      if(ops.length<2||cor<0) return;
      S.setup.questions.push({id:uid(),stage:sid,cat:'',text:ls[0],options:ops,correct:cor}); n++;
    });
    if(!n){ toast('Format tanilmadi'); return; }
    S.bulk=false; saveSetup(); render(); toast(n+' ta savol qo\u2018shildi'); return;
  }

  if(a==='new-p'){ S.editP={id:'',chainId:activeChain(),name:'',staff:0}; render(); return; }
  if(a==='edit-p'){ S.setup.branches.forEach(function(p){ if(p.id===id) S.editP={id:p.id,chainId:p.chainId,name:p.name,staff:p.staff||0}; }); render(); window.scrollTo(0,0); return; }
  if(a==='del-p'){
    if(!confirm('Filial o\u2018chirilsinmi?')) return;
    S.setup.branches=S.setup.branches.filter(function(p){return p.id!==id;});
    saveSetup(); render(); return;
  }
  if(a==='save-p'){
    var nm=document.getElementById('p-name').value.trim(), sf=parseInt(document.getElementById('p-staff').value,10)||0;
    if(!nm){ toast('Nomini yozing'); return; }
    var pc=document.getElementById('p-chain').value;
    if(S.editP.id) S.setup.branches.forEach(function(p){ if(p.id===S.editP.id){p.name=nm;p.staff=sf;p.chainId=pc;} });
    else S.setup.branches.push({id:uid(),chainId:pc,name:nm,staff:sf});
    S.editP=null; saveSetup(); render(); toast('Saqlandi'); return;
  }
  if(a==='cancel-p'){ S.editP=null; render(); return; }
  if(a==='merge-p'){ S.mergeFrom=id; render(); window.scrollTo(0,0); return; }
  if(a==='cancel-merge'){ S.mergeFrom=null; render(); return; }
  if(a==='do-merge'){
    var to=document.getElementById('merge-to').value, tb=branchById(to);
    var from=S.mergeFrom;
    var affected=S.results.filter(function(r){ return r.branchId===from; });
    var ids=affected.map(function(r){ return r.id; });
    S.setup.branches=S.setup.branches.filter(function(b){return b.id!==from;});
    S.mergeFrom=null; saveSetup();
    batchUpdateResults(ids,{branchId:to,branchName:tb.name}).then(function(){
      S.results.forEach(function(r){ if(r.branchId===from){ r.branchId=to; r.branchName=tb.name; } });
      render(); toast('Filiallar birlashtirildi');
    });
    return;
  }
  if(a==='new-chain'){
    var nn=prompt('Yangi tarmoq nomi:'); if(!nn||!nn.trim()) return;
    S.setup.chains.push({id:uid(),name:nn.trim()}); saveSetup(); render(); return;
  }
  if(a==='ren-chain'){
    var ch=chainById(id); if(!ch) return;
    var nv=prompt('Tarmoq nomi:',ch.name); if(!nv||!nv.trim()) return;
    ch.name=nv.trim(); saveSetup();
    var affected=S.results.filter(function(r){ return r.chainId===id; });
    var ids=affected.map(function(r){ return r.id; });
    batchUpdateResults(ids,{chainName:ch.name}).then(function(){
      S.results.forEach(function(r){ if(r.chainId===id) r.chainName=ch.name; });
      render();
    });
    return;
  }
  if(a==='del-chain'){
    if(branchesOf(id).length){ toast('Avval bu tarmoq filiallarini o\u2018chiring'); return; }
    if(!confirm('Tarmoq o\u2018chirilsinmi?')) return;
    S.setup.chains=S.setup.chains.filter(function(x){return x.id!==id;});
    saveSetup(); render(); return;
  }

  if(a==='save-settings'){
    var c=S.setup.config;
    c.org=document.getElementById('s-org').value.trim()||'Homeocan';
    c.testName=document.getElementById('s-name').value.trim()||'Bilim marafoni';
    c.logoUrl=document.getElementById('s-logo').value.trim();
    c.timeLimitMin=Math.max(0,parseInt(document.getElementById('s-time').value,10)||0);
    c.passPercent=Math.min(100,Math.max(0,parseInt(document.getElementById('s-pass').value,10)||0));
    c.shuffle=document.getElementById('s-shuffle').checked;
    c.shuffleOptions=document.getElementById('s-shopt').checked;
    c.showReview=document.getElementById('s-review').checked;
    saveSetup(); render(); toast('Sozlamalar saqlandi'); return;
  }
  if(a==='save-fair'){
    var c2=S.setup.config;
    c2.kFactor=Math.max(0,parseInt(document.getElementById('s-k').value,10)||0);
    c2.minCoverage=Math.min(100,Math.max(0,parseInt(document.getElementById('s-cov').value,10)||0));
    c2.prizes=[document.getElementById('s-p1').value,document.getElementById('s-p2').value,document.getElementById('s-p3').value];
    saveSetup(); render(); toast('Formula saqlandi'); return;
  }
  if(a==='refresh-bank'){
    if(!confirm('Savollar va bosqichlar fayldagi asl holatga qaytariladi. Natijalar saqlanib qoladi. Davom etilsinmi?')) return;
    refreshBank(); render(); toast(S.setup.questions.length+' savol yuklandi'); return;
  }
  if(a==='export-csv'){ if(!S.results.length){toast('Natijalar yo\u2018q');return;} download('kids09-natijalar.csv',csv()); return; }
  if(a==='export-json'){ download('kids09-zaxira.json',JSON.stringify({setup:S.setup,results:S.results},null,2),'application/json'); return; }
  if(a==='import-json'){
    var raw=prompt('Zaxira JSON matnini joylashtiring:'); if(!raw) return;
    try{ var d=JSON.parse(raw);
      if(d.setup&&d.setup.config&&d.setup.stages){
        S.setup=d.setup; saveSetup();
        clearAllResults().then(function(){ return bulkAddResults(d.results||[]); })
          .then(function(){ return loadResults(); })
          .then(function(list){ S.results=list; render(); toast('Tiklandi'); });
      }else toast('Tuzilish mos emas');
    }catch(x){ toast('JSON o\u2018qilmadi'); }
    return;
  }
  if(a==='del-result'){
    if(!confirm('O\u2018chirilsinmi?')) return;
    deleteResultDoc(id).then(function(){
      S.results=S.results.filter(function(r){return r.id!==id;}); render();
    }).catch(function(){ toast('O\u2018chirib bo\u2018lmadi'); });
    return;
  }
  if(a==='clear-results'){
    if(!confirm('BARCHA natijalar o\u2018chiriladi. Davom etilsinmi?')) return;
    clearAllResults().then(function(){ S.results=[]; render(); toast('Tozalandi'); });
    return;
  }
  if(a==='factory'){
    if(!confirm('Hammasi boshlang\u2018ich holatga qaytariladi. Davom etilsinmi?')) return;
    S.setup=JSON.parse(JSON.stringify(DEFAULT_SETUP)); S.me=null;
    saveSetup(); clearAllResults().then(function(){ S.results=[]; render(); });
    return;
  }
});
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(!S.me&&S.view==='enter'&&e.target.id&&e.target.id.indexOf('f-')===0){ e.preventDefault(); app.querySelector('[data-act="login-me"]').click(); }
});

Promise.all([sGet(SETUP_KEY),loadResults()]).then(function(v){
  var su=v[0];
  if(su&&su.config&&su.stages&&su.questions){
    S.setup=su;
    for(var k in DEFAULT_SETUP.config) if(S.setup.config[k]===undefined) S.setup.config[k]=DEFAULT_SETUP.config[k];
    if(!Array.isArray(S.setup.chains)||!S.setup.chains.length) S.setup.chains=DEFAULT_SETUP.chains.slice();
    if(!Array.isArray(S.setup.branches)) S.setup.branches=[];
    if(S.setup.ver!==BANK_VER){
      refreshBank();
      setTimeout(function(){ toast('Savol banki yangilandi: '+S.setup.questions.length+' savol, '+S.setup.stages.length+' bosqich'); },800);
    }
  }else{
    S.setup=JSON.parse(JSON.stringify(DEFAULT_SETUP)); sSet(SETUP_KEY,S.setup);
  }
  S.results=v[1];
  S.ready=true; render();
}).catch(function(){ S.setup=JSON.parse(JSON.stringify(DEFAULT_SETUP)); S.results=[]; S.ready=true; render(); });

auth.onAuthStateChanged(function(u){
  S.authed=!!u;
  if(S.ready) render();
});

})();
</script>
